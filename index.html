<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon Pop</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Balloon Pop</h1>
    <p class="intro">The Maple Street Fair's booth game: press Play, then pop the balloons before they float away.</p>
    <p id="score" aria-live="polite">Score: 0</p>
    <canvas id="game" width="480" height="360" role="img" aria-label="Balloon Pop: balloons float up from the bottom of the sky; tap one to pop it.">
      Balloon Pop: balloons float up from the bottom of the sky; tap one to pop it.
    </canvas>
    <button id="play-button" type="button">Play</button>
  </main>
</body>
</html>
